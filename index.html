<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Склад</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f2f5;
            padding: 15px;
            padding-bottom: 30px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        
        .header h2 {
            font-size: 24px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .card h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input, button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        button:disabled {
            opacity: 0.6;
            transform: none;
        }
        
        button.camera {
            background: #28a745;
        }
        
        button.camera:active {
            background: #218838;
        }
        
        button.refresh {
            background: #6c757d;
        }
        
        .photo-preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin: 10px 0;
            border: 1px solid #eee;
        }
        
        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .inventory-item {
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .inventory-item:last-child {
            border-bottom: none;
        }
        
        .inventory-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #f0f2f5;
            flex-shrink: 0;
        }
        
        .inventory-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .inventory-item .name {
            font-weight: 600;
            font-size: 16px;
            color: #1a1a2e;
            word-break: break-word;
        }
        
        .inventory-item .cell {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
        
        .inventory-item .date {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #999;
        }
        
        .empty-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📦 Учет склада</h2>
        <p>Фотографируй и запоминай, где что лежит</p>
    </div>

    <!-- Форма добавления -->
    <div class="card">
        <h3>➕ Добавить хрень</h3>
        <input type="text" id="itemName" placeholder="Что это? (Например: Дрель Макита)">
        <input type="text" id="itemCell" placeholder="Где искать? (Например: Стеллаж-3/Верх)">
        <button class="camera" id="takePhotoBtn">📸 Сделать фото</button>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
        <img id="photoPreview" class="photo-preview" style="display:none;" />
        <button id="saveBtn">💾 Сохранить на склад</button>
        <div id="statusMessage" class="status-message" style="display:none;"></div>
    </div>

    <!-- Список -->
    <div class="card">
        <h3>
            📋 Вся хрень на складе
            <span id="countBadge" style="margin-left:auto;font-size:14px;color:#666;font-weight:400;"></span>
        </h3>
        <div id="inventoryList">Загрузка...</div>
        <button class="refresh" id="refreshBtn" style="margin-top:12px;">🔄 Обновить список</button>
    </div>

    <script>
        // ============================================================
        // НАСТРОЙКА
        // ============================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyX5EdumYWkTDokp2mCIUuo1h9-DGuXyEf0dFYakSFr6ROps6EhTAdh17jprlaA7sLM/exec';
        
        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const nameInput = document.getElementById('itemName');
        const cellInput = document.getElementById('itemCell');
        const photoPreview = document.getElementById('photoPreview');
        const fileInput = document.getElementById('fileInput');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusMsg = document.getElementById('statusMessage');
        const inventoryDiv = document.getElementById('inventoryList');
        const countBadge = document.getElementById('countBadge');
        
        let currentPhotoBase64 = '';
        
        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function showStatus(message, type) {
            statusMsg.textContent = message;
            statusMsg.className = 'status-message';
            if (type) statusMsg.classList.add('status-' + type);
            statusMsg.style.display = 'block';
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 5000);
            }
        }
        
        function showSuccess(message) {
            showStatus(message || '✅ Успешно!', 'success');
        }
        
        function showError(message) {
            showStatus('❌ ' + message, 'error');
        }
        
        // ============================================================
        // РАБОТА С КАМЕРОЙ
        // ============================================================
        takePhotoBtn.addEventListener('click', () => {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                showError('Файл слишком большой (макс. 10MB)');
                fileInput.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64String = e.target.result.split(',')[1];
                currentPhotoBase64 = base64String;
                
                photoPreview.src = e.target.result;
                photoPreview.style.display = 'block';
                showSuccess('✅ Фото готово!');
            };
            reader.onerror = () => {
                showError('Не удалось прочитать файл');
                fileInput.value = '';
            };
            reader.readAsDataURL(file);
        });
        
        // ============================================================
        // СОХРАНЕНИЕ (через fetch с no-cors)
        // ============================================================
        saveBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const cell = cellInput.value.trim();
            
            if (!name) {
                showError('Введите название!');
                nameInput.focus();
                return;
            }
            
            if (!cell) {
                showError('Введите ячейку!');
                cellInput.focus();
                return;
            }
            
            if (!currentPhotoBase64) {
                showError('Сделайте фото!');
                return;
            }
            
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ Отправка...';
            showStatus('⏳ Отправка на облачный склад...', 'loading');
            
            try {
                const payload = {
                    name: name,
                    cell: cell,
                    photo: currentPhotoBase64
                };
                
                // Отправляем через fetch с no-cors
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                // При no-cors мы не можем прочитать ответ, но запрос уходит!
                showSuccess('✅ Отправлено! Проверь таблицу через 5 секунд.');
                
                // Очищаем форму
                nameInput.value = '';
                cellInput.value = '';
                photoPreview.style.display = 'none';
                currentPhotoBase64 = '';
                fileInput.value = '';
                
                // Обновляем список через 5 секунд
                setTimeout(loadInventoryJsonp, 5000);
                
            } catch (error) {
                showError('Ошибка: ' + error.message);
                console.error('Детали ошибки:', error);
            }
            
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 Сохранить на склад';
        });
        
        // ============================================================
        // ЗАГРУЗКА СПИСКА (JSONP - обход CORS)
        // ============================================================
        function loadInventoryJsonp() {
            inventoryDiv.innerHTML = '⏳ Загружаю список...';
            countBadge.textContent = '';
            
            const callbackName = 'jsonpCallback_' + Date.now();
            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?callback=' + callbackName + '&t=' + Date.now();
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                
                if (!data || !data.success) {
                    inventoryDiv.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">⚠️</span>
                            Ошибка: ${data ? data.error : 'Нет данных'}
                        </div>
                    `;
                    return;
                }
                
                const items = data.data || [];
                if (items.length === 0) {
                    inventoryDiv.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            Склад пуст<br>
                            <span style="font-size:13px;">Добавь первую хрень!</span>
                        </div>
                    `;
                    countBadge.textContent = '0';
                    return;
                }
                
                countBadge.textContent = items.length;
                
                let html = '';
                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    const name = item['Название'] || 'Без имени';
                    const cell = item['Ячейка'] || 'Не указана';
                    const date = item['Дата добавления'] || '';
                    const photoUrl = item['Ссылка на фото'] || '';
                    
                    const imgHtml = photoUrl 
                        ? `<img src="${photoUrl}" alt="${name}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect width=%2260%22 height=%2260%22 fill=%22%23f0f2f5%22/%3E%3Ctext x=%2230%22 y=%2232%22 text-anchor=%22middle%22 font-size=%2224%22%3E📷%3C/text%3E%3C/svg%3E'" />` 
                        : `<div style="width:60px;height:60px;background:#f0f2f5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;">📷</div>`;
                    
                    html += `
                        <div class="inventory-item">
                            ${imgHtml}
                            <div class="info">
                                <div class="name">${escapeHtml(name)}</div>
                                <span class="cell">📍 ${escapeHtml(cell)}</span>
                                ${date ? `<span class="date">${escapeHtml(date)}</span>` : ''}
                            </div>
                        </div>
                    `;
                }
                inventoryDiv.innerHTML = html;
            };
            
            document.body.appendChild(script);
            
            setTimeout(() => {
                if (window[callbackName]) {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    inventoryDiv.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">⏰</span>
                            Таймаут загрузки<br>
                            <span style="font-size:13px;">Проверь интернет и нажми "Обновить"</span>
                        </div>
                    `;
                }
            }, 15000);
        }
        
        // ============================================================
        // ЗАЩИТА ОТ XSS
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================================
        // ОБНОВЛЕНИЕ
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', loadInventoryJsonp);
        
        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadInventoryJsonp();
        
        if (SCRIPT_URL.includes('ТВОЙ_ИД_СКРИПТА')) {
            inventoryDiv.innerHTML = `
                <div class="empty-state">
                    <span class="icon">⚙️</span>
                    Настройка<br>
                    <span style="font-size:13px;">Вставь SCRIPT_URL в код</span>
                </div>
            `;
        }
    </script>
</body>
</html>
